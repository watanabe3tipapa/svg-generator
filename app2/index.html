<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>SVG Editor</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main>
            <h1>SVG Editor</h1>

            <section id="controls">
                <label
                    >幅: <input id="width" type="number" value="800" min="1"
                /></label>
                <label
                    >高さ: <input id="height" type="number" value="600" min="1"
                /></label>
                <label
                    >背景色: <input id="bg" type="color" value="#ffffff"
                /></label>

                <button id="addRect">長方形追加</button>
                <button id="addCircle">円追加</button>
                <button id="download">SVG ダウンロード</button>
            </section>

            <section id="workspace">
                <div id="svgContainer"></div>
                <aside id="layerPanel">
                    <h2>レイヤー</h2>
                    <ul id="layers"></ul>
                    <button id="bringForward">前へ</button>
                    <button id="sendBackward">後ろへ</button>
                </aside>
            </section>
        </main>

        <script src="app.js"></script>
    </body>
</html>
