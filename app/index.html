<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>SVG Generator</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main>
            <h1>SVG Generator</h1>

            <section id="controls">
                <label
                    >幅: <input id="width" type="number" value="800" min="1"
                /></label>
                <label
                    >高さ: <input id="height" type="number" value="600" min="1"
                /></label>
                <label
                    >背景色: <input id="bg" type="color" value="#ffffff"
                /></label>
                <button id="addRect">長方形追加</button>
                <button id="generate">SVG を生成・表示</button>
                <button id="download">SVG をダウンロード</button>
            </section>

            <section id="preview">
                <h2>プレビュー</h2>
                <div id="svgContainer"></div>
            </section>
        </main>

        <script src="app.js"></script>
    </body>
</html>
